[project]
name="Tracking-Core"
version = "0.1.0"
requires-python = ">= 3.10"
description = "This module implements the BoTSORT tracking algorithm on incoming detections"
authors = [{name = "Sipho Mancam", email="siphomancam2@gmail.com"}]
dependencies = [
    "confluent-kafka==2.5.0",
    "contourpy==1.3.0",
    "cycler==0.12.1",
    "Cython==3.0.11",
    "cython-bbox==0.1.5",
    "filelock==3.15.4",
    "fonttools==4.53.1",
    "fsspec==2024.6.1",
    "Jinja2==3.1.4",
    "joblib==1.4.2",
    "kiwisolver==1.4.5",
    "lab==8.2",
    "lap==0.4.0",
    "MarkupSafe==2.1.5",
    "matplotlib==3.9.2",
    "mpmath==1.3.0",
    "networkx==3.3",
    "numpy==1.26.3",
    "opencv-python==4.10.0.84",
    "packaging==24.1",
    "pillow==10.4.0",
    "pyparsing==3.1.4",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.2",
    "scikit-learn==1.5.1",
    "scipy==1.14.1",
    "simplejson==3.19.3",
    "six==1.16.0",
    "sympy==1.13.2",
    "termcolor==2.4.0",
    "threadpoolctl==3.5.0",
    "torch==2.4.0",
    "txt2tags==3.9",
    "typing_extensions==4.12.2",
    "yacs==0.1.8",
]


[project.scripts]
tracking_core = "App:main_loop"


[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"